# 安全示例：只包含通用字段，不包含用户实际 tunnel_id 或 API Key。
# 私人凭据由环境变量 CONTROL_PLANE_TUNNEL_ID 和 CONTROL_PLANE_API_KEY 提供。
# 需将下面的示例绝对路径替换为自己本机的实际可执行文件和 TOML 配置路径。
config_version: 1

control_plane:
  base_url: https://api.openai.com

mcp:
  commands:
    - channel: main
      command: "/absolute/path/to/wardrobe -mcp-stdio -config /absolute/path/to/Data/config.toml"

health:
  listen_addr: "127.0.0.1:0"

admin_ui:
  open_browser: false

log:
  level: info
  format: json
