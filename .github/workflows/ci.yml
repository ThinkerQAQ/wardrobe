name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/audit-public.sh
      - run: go test ./...
      - run: go vet ./...
      - run: python3 scripts/test_package_installer.py -v
      - name: Verify distributable dependency licenses
        run: |
          mkdir -p .build/tools
          GOTOOLCHAIN="$(go env GOVERSION)" GOBIN="$PWD/.build/tools" go install github.com/google/go-licenses/v2@v2.0.1
          CGO_ENABLED=0 .build/tools/go-licenses save . --ignore=wardrobe --save_path="$PWD/.build/licenses"
          test -s .build/licenses/modernc.org/sqlite/LICENSE

      - name: Go vulnerability scan (reachable code)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: node --check web/app.js
      - run: node --check web/lookbook.js
      - run: node --check web/orders.js
      - run: node --test web/tests/*.test.cjs
      - run: node --check browser-extension/background.js
      - run: node --check browser-extension/panel.js
      - run: node --check web/runtime.js
      - run: node --check web/locale.js
      - run: node --check web/mcp-connection.js
      - run: node --check web/extension-controls.js
      - run: node scripts/sync-browser-ui.mjs --check
      - run: bash tests/install-extension.test.sh
      - run: node --test browser-extension/tests/*.test.cjs
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/wardrobe.exe .
      - name: Native packaging checks
        run: python3 scripts/test_package_installer.py -v

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: Validate native installer without shell setup
        shell: cmd
        run: python scripts/test_package_installer.py -v
